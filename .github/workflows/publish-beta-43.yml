name: Publish VFIT beta.43 APK

on:
  push:
    branches:
      - codex/vfit-beta-hardening
    paths:
      - .github/workflows/publish-beta-43.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the validated beta.43 build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 37140726788 --repo "$GITHUB_REPOSITORY" --name vfit-beta-android-debug --dir dist

      - name: Check APK hash
        run: echo 'f90150d55f5636f77eb464af6acbb5eb3770d94ba36ecd8713bbd301575f8a66  dist/app-debug.apk' | sha256sum --check -

      - name: Publish public prerelease with direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.1.0-beta.43 \
            'dist/app-debug.apk#VFIT-beta.43-debug.apk' \
            --repo "$GITHUB_REPOSITORY" \
            --target 4e7de7b84c917ef287dc5704d8d08b848f5e297f \
            --title 'VFIT 2.1.0 beta.43' \
            --notes 'Adds Payments & Billing with verified Stripe prices, Checkout and subscription status. Live charging is disabled until the owner completes Stripe and Firebase setup. This is an Android debug APK for beta testing.' \
            --prerelease
