name: Validate VFIT

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/static-audit.cjs
      - run: node tests/state-smoke.cjs
      - run: node tests/photo-storage.cjs
      - run: find core training nutrition ui metrics coaching firebase feedback -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --check App.js
      - run: node --check sw.js
      - run: node --check functions/index.js
